name: Build MRzefvSearch.dylib

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Compile
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -fmodules -O2 \
            -framework Foundation -framework UIKit \
            -install_name @rpath/MRzefvSearch.dylib \
            -o build/MRzefvSearch.dylib src/MRzefvSearch.m
          ldid -S build/MRzefvSearch.dylib
          file build/MRzefvSearch.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: MRzefvSearch.dylib
          path: build/MRzefvSearch.dylib

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MRzefvSearch.dylib
